# .github/workflows/weather_backtest.yml
# Downloads ~90 days of Kalshi temperature-market history + historical forecasts, runs the backtest,
# commits results/weather_backtest.md, and keeps the raw history as an artifact.
name: weather-backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of history"
        default: "90"
  schedule:
    - cron: "45 13 * * 0"       # weekly refresh, Sunday ~8:45am ET

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Fetch history
        run: python -u weather_backtest.py fetch --days "${{ inputs.days || '90' }}" --out wb
      - name: Analyze
        run: python -u weather_backtest.py analyze --out wb --report results/weather_backtest.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-history-${{ github.run_number }}
          path: wb/
          retention-days: 90
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Weather backtest $(date -u +%Y-%m-%d)" || echo "no change"
          git pull --rebase && git push
